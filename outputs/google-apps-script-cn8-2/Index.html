<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dashboard điều hành dự án CN8-2">
  <title>CN8-2 | Project Control</title>
    <style>
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --surface-2: #f8fafb;
  --ink: #17212b;
  --muted: #667482;
  --line: #dfe4e8;
  --navy: #17324d;
  --blue: #236aa2;
  --teal: #16736f;
  --green: #2f7a4b;
  --amber: #ad6b08;
  --red: #b23a32;
  --red-soft: #faecea;
  --amber-soft: #fff4dd;
  --green-soft: #eaf5ee;
  --blue-soft: #eaf2f8;
  --shadow: 0 5px 18px rgba(23, 50, 77, .08);
}

* { box-sizing: border-box; }
html { min-width: 320px; background: var(--bg); }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background: var(--bg);
  font-family: Arial, "Segoe UI", sans-serif;
  font-size: 14px;
}
button, input, select { font: inherit; }
button { cursor: pointer; }

.app-shell { min-height: 100vh; display: grid; grid-template-columns: 228px minmax(0, 1fr); }
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 30;
  width: 228px;
  display: flex;
  flex-direction: column;
  background: #152d43;
  color: #fff;
  border-right: 1px solid rgba(255,255,255,.08);
}
.brand-block { height: 76px; display: flex; align-items: center; gap: 12px; padding: 0 18px; border-bottom: 1px solid rgba(255,255,255,.1); }
.brand-mark {
  width: 38px; height: 38px; display: grid; place-items: center;
  background: #fff; color: var(--navy); font-weight: 800; border-radius: 6px;
}
.brand-block strong { display: block; font-size: 17px; }
.brand-block span { display: block; margin-top: 2px; color: #a9bbc9; font-size: 11px; }
.nav-list { padding: 14px 10px; display: grid; gap: 4px; }
.nav-item {
  border: 0; border-radius: 5px; min-height: 42px; padding: 0 12px;
  display: flex; align-items: center; gap: 11px; text-align: left;
  color: #c7d4de; background: transparent; font-weight: 600;
}
.nav-item:hover { background: rgba(255,255,255,.07); color: #fff; }
.nav-item.active { background: #fff; color: var(--navy); }
.nav-glyph { width: 18px; text-align: center; font-size: 17px; font-weight: 400; }
.sidebar-foot {
  margin-top: auto; padding: 17px 18px; display: flex; gap: 9px; align-items: center;
  border-top: 1px solid rgba(255,255,255,.1);
}
.source-dot, .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ec890; flex: 0 0 auto; }
.sidebar-foot strong, .sidebar-foot span { display: block; font-size: 11px; }
.sidebar-foot span { color: #a9bbc9; margin-top: 3px; }

.main { grid-column: 2; min-width: 0; }
.topbar {
  height: 76px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 18px;
  background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20;
}
.topbar h1 { margin: 1px 0 0; font-size: 20px; line-height: 1.15; letter-spacing: 0; }
.eyebrow { margin: 0; font-size: 10px; font-weight: 700; letter-spacing: .12em; color: var(--muted); }
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.sync-status { display: flex; align-items: center; gap: 9px; padding-right: 9px; }
.sync-status strong, .sync-status span { display: block; white-space: nowrap; }
.sync-status strong { font-size: 12px; }
.sync-status span { font-size: 10px; color: var(--muted); margin-top: 3px; }
.icon-button, .avatar-button {
  border: 1px solid var(--line); background: var(--surface); color: var(--navy);
  width: 36px; height: 36px; display: grid; place-items: center; border-radius: 5px; font-weight: 700;
}
.icon-button:hover, .avatar-button:hover { border-color: #a9b6c0; background: var(--surface-2); }
.avatar-button { width: 42px; font-size: 10px; background: var(--navy); color: #fff; border-color: var(--navy); }
.mobile-menu { display: none; }
.content { padding: 22px 24px 40px; max-width: 1640px; margin: 0 auto; }

.page-intro { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 16px; }
.page-intro h2 { font-size: 17px; margin: 0 0 5px; }
.page-intro p { margin: 0; color: var(--muted); line-height: 1.5; }
.filter-row { display: flex; gap: 8px; flex-wrap: wrap; }
.filter-select, .search-input {
  min-height: 36px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface);
  color: var(--ink); padding: 0 10px; outline: none;
}
.search-input { min-width: 250px; }
.filter-select:focus, .search-input:focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(35,106,162,.12); }

.kpi-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.kpi {
  background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 15px;
  min-height: 118px; box-shadow: 0 1px 1px rgba(23,50,77,.02);
}
.kpi-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; }
.kpi-value { margin-top: 14px; font-size: 29px; line-height: 1; font-weight: 760; color: var(--navy); }
.kpi-unit { font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 3px; }
.kpi-foot { margin-top: 11px; color: var(--muted); font-size: 11px; display: flex; justify-content: space-between; gap: 6px; }
.trend-negative { color: var(--red); font-weight: 700; }
.trend-warning { color: var(--amber); font-weight: 700; }
.trend-positive { color: var(--green); font-weight: 700; }
.status-pill {
  display: inline-flex; align-items: center; min-height: 23px; padding: 0 8px; border-radius: 12px;
  font-size: 10px; font-weight: 700; white-space: nowrap;
}
.pill-red { color: var(--red); background: var(--red-soft); }
.pill-amber { color: var(--amber); background: var(--amber-soft); }
.pill-green { color: var(--green); background: var(--green-soft); }
.pill-blue { color: var(--blue); background: var(--blue-soft); }
.pill-gray { color: #596674; background: #edf0f2; }

.grid { display: grid; gap: 14px; margin-bottom: 14px; }
.grid-main { grid-template-columns: minmax(0, 1.65fr) minmax(330px, .85fr); }
.grid-equal { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 7px; min-width: 0;
  box-shadow: 0 1px 1px rgba(23,50,77,.02);
}
.panel-head { min-height: 53px; padding: 0 15px; display: flex; align-items: center; justify-content: space-between; gap: 14px; border-bottom: 1px solid var(--line); }
.panel-head h3 { margin: 0; font-size: 13px; }
.panel-head p { margin: 3px 0 0; color: var(--muted); font-size: 10px; }
.panel-body { padding: 15px; }
.panel-link { border: 0; background: transparent; color: var(--blue); font-size: 11px; font-weight: 700; padding: 4px; }

.alert-list { display: grid; gap: 10px; }
.alert-item { padding: 12px; border-left: 3px solid var(--amber); background: #fffaf0; }
.alert-item.critical { border-left-color: var(--red); background: #fff7f6; }
.alert-item strong { font-size: 12px; line-height: 1.35; display: block; }
.alert-item p { color: var(--muted); font-size: 11px; line-height: 1.45; margin: 5px 0 0; }
.alert-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 10px; color: var(--muted); }

.chart-wrap { height: 250px; position: relative; }
canvas { width: 100%; height: 100%; display: block; }
.legend { display: flex; gap: 16px; align-items: center; font-size: 10px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { display: block; width: 18px; height: 3px; background: var(--blue); }
.legend .actual i { background: var(--teal); }

.zone-list { display: grid; gap: 14px; }
.zone-row { display: grid; grid-template-columns: 68px minmax(0, 1fr) 50px; gap: 10px; align-items: center; }
.zone-name { font-weight: 700; font-size: 12px; }
.progress-stack { display: grid; gap: 5px; }
.progress-line { height: 8px; border-radius: 4px; background: #e8ecef; overflow: hidden; }
.progress-line span { display: block; height: 100%; min-width: 2px; border-radius: 4px; background: var(--blue); }
.progress-line.shoring span { background: var(--teal); }
.zone-value { text-align: right; font-size: 11px; color: var(--muted); }
.zone-caption { font-size: 9px; color: var(--muted); display: flex; justify-content: space-between; }

.table-wrap { overflow-x: auto; }
.data-table { width: 100%; border-collapse: collapse; min-width: 720px; }
.data-table th {
  padding: 10px 12px; background: var(--surface-2); color: var(--muted); text-align: left;
  font-size: 10px; text-transform: uppercase; border-bottom: 1px solid var(--line); white-space: nowrap;
}
.data-table td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 11px; }
.data-table tbody tr:last-child td { border-bottom: 0; }
.data-table tbody tr:hover { background: #fafcfd; }
.click-row { cursor: pointer; }
.cell-title { font-weight: 700; color: var(--ink); line-height: 1.35; }
.cell-sub { color: var(--muted); margin-top: 3px; font-size: 10px; }

.bar-chart { display: grid; gap: 11px; }
.bar-row { display: grid; grid-template-columns: 94px minmax(0,1fr) 38px; gap: 10px; align-items: center; font-size: 11px; }
.bar-track { height: 13px; background: #edf0f2; overflow: hidden; border-radius: 3px; }
.bar-fill { height: 100%; background: var(--blue); border-radius: 3px; }
.bar-fill.teal { background: var(--teal); }

.monitor-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.monitor-card { border: 1px solid var(--line); border-radius: 6px; padding: 12px; background: var(--surface); }
.monitor-card.highest { border-color: #e0aaa5; background: #fff9f8; }
.monitor-card.review { border-color: #e7c486; background: #fffbf4; }
.monitor-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.monitor-point { font-weight: 800; color: var(--navy); }
.monitor-value { font-size: 23px; margin: 10px 0 3px; color: var(--navy); font-weight: 750; }
.monitor-value span { font-size: 10px; color: var(--muted); }
.sparkline { width: 100%; height: 42px; margin-top: 8px; }
.monitor-note {
  margin-top: 12px; padding: 10px 12px; background: var(--amber-soft); color: #75500d;
  border-left: 3px solid var(--amber); font-size: 11px; line-height: 1.5;
}

.doc-list { display: grid; }
.doc-item { padding: 12px 14px; display: grid; grid-template-columns: 88px minmax(0,1fr) 95px 115px; gap: 12px; align-items: center; border-bottom: 1px solid var(--line); }
.doc-item:last-child { border-bottom: 0; }
.doc-item:hover { background: #fafcfd; }
.doc-name { font-size: 11px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-meta { color: var(--muted); font-size: 10px; }
.file-type { color: var(--blue); font-size: 10px; font-weight: 700; }

.week-selector { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.week-card {
  border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 14px;
  text-align: left; color: var(--ink); box-shadow: 0 1px 1px rgba(23,50,77,.02);
}
.week-card:hover { border-color: #aebac4; }
.week-card.active { border-color: var(--blue); box-shadow: inset 0 0 0 1px var(--blue); background: #f7fbfe; }
.week-card-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.week-card-top > div { display: flex; align-items: center; gap: 9px; }
.week-card-top > span { color: var(--muted); font-size: 11px; }
.week-index { color: var(--blue); font-weight: 800; font-size: 11px; }
.week-card p { min-height: 40px; margin: 11px 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
.week-count { font-size: 10px; font-weight: 700; color: var(--navy); }
.lookahead-table { min-width: 920px; }
.milestone-list { position: relative; display: grid; gap: 0; }
.milestone-item { display: grid; grid-template-columns: 48px 18px minmax(0,1fr); gap: 8px; min-height: 54px; align-items: start; }
.milestone-item:not(:last-child) .milestone-dot::after {
  content: ""; position: absolute; top: 9px; left: 3px; width: 1px; height: 48px; background: var(--line);
}
.milestone-date { color: var(--navy); font-size: 11px; font-weight: 800; padding-top: 2px; }
.milestone-dot { position: relative; width: 8px; height: 8px; margin-top: 3px; border-radius: 50%; background: var(--blue); }
.milestone-item strong { display: block; font-size: 11px; line-height: 1.35; }
.milestone-item span { display: block; color: var(--muted); font-size: 10px; margin-top: 3px; }
.gate-list { display: grid; gap: 9px; }
.gate-item { min-height: 38px; padding: 9px 11px; display: flex; align-items: center; gap: 9px; background: var(--surface-2); border: 1px solid var(--line); font-size: 11px; }
.gate-item span { width: 19px; height: 19px; display: grid; place-items: center; background: var(--green-soft); color: var(--green); border-radius: 50%; font-weight: 800; }

.drawer-backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(15,28,39,.32); opacity: 0; pointer-events: none; transition: opacity .18s ease; }
.detail-drawer {
  position: fixed; z-index: 50; inset: 0 0 0 auto; width: min(460px, 92vw); background: var(--surface);
  transform: translateX(100%); transition: transform .2s ease; box-shadow: -12px 0 28px rgba(23,50,77,.14);
}
.drawer-open .drawer-backdrop { opacity: 1; pointer-events: auto; }
.drawer-open .detail-drawer { transform: translateX(0); }
.drawer-head { height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 18px; border-bottom: 1px solid var(--line); }
.drawer-head h2 { margin: 3px 0 0; font-size: 17px; }
.drawer-body { padding: 18px; overflow-y: auto; height: calc(100vh - 76px); }
.detail-section { margin-bottom: 20px; }
.detail-section h3 { font-size: 11px; color: var(--muted); text-transform: uppercase; margin: 0 0 8px; }
.detail-section p { line-height: 1.55; margin: 0; }
.detail-grid { display: grid; grid-template-columns: 130px minmax(0,1fr); gap: 9px 12px; font-size: 12px; }
.detail-grid span:nth-child(odd) { color: var(--muted); }
.path-box { padding: 10px; border: 1px solid var(--line); background: var(--surface-2); word-break: break-all; font-size: 10px; line-height: 1.5; color: var(--muted); }
.copy-button { min-height: 34px; border: 1px solid var(--line); background: var(--surface); color: var(--blue); padding: 0 11px; border-radius: 5px; font-weight: 700; font-size: 11px; }

.empty-state { padding: 50px 20px; text-align: center; color: var(--muted); }
.toast {
  position: fixed; left: 50%; bottom: 24px; z-index: 80; transform: translate(-50%, 120px);
  background: #162b3e; color: #fff; padding: 10px 14px; border-radius: 5px; box-shadow: var(--shadow);
  transition: transform .2s ease; font-size: 12px;
}
.toast.show { transform: translate(-50%, 0); }

@media (max-width: 1180px) {
  .kpi-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid-main { grid-template-columns: 1fr; }
  .monitor-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 820px) {
  .app-shell { display: block; }
  .main { margin-left: 0; }
  .sidebar { transform: translateX(-100%); transition: transform .2s ease; box-shadow: 12px 0 30px rgba(15,28,39,.2); }
  .sidebar.open { transform: translateX(0); }
  .mobile-menu { display: grid; }
  .topbar { height: 68px; padding: 0 14px; justify-content: flex-start; }
  .topbar-actions { margin-left: auto; }
  .sync-status { display: none; }
  .content { padding: 16px 14px 32px; }
  .page-intro { display: block; }
  .filter-row { margin-top: 12px; }
  .search-input { min-width: 0; width: 100%; }
  .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-equal { grid-template-columns: 1fr; }
  .monitor-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .week-selector { grid-template-columns: 1fr; }
  .doc-item { grid-template-columns: 74px minmax(0,1fr); }
  .doc-item > :nth-child(3), .doc-item > :nth-child(4) { display: none; }
}
@media (max-width: 520px) {
  .topbar h1 { font-size: 17px; }
  .kpi-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  .kpi { min-height: 105px; padding: 12px; }
  .kpi-value { font-size: 24px; }
  .monitor-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  .monitor-value { font-size: 20px; }
  .zone-row { grid-template-columns: 55px minmax(0,1fr) 40px; }
}

  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">

  <script>
let data = window.CN8_DATA;
const content = document.getElementById("content");
const pageTitle = document.getElementById("pageTitle");
const drawer = document.getElementById("detailDrawer");
const drawerBackdrop = document.getElementById("drawerBackdrop");
const drawerTitle = document.getElementById("drawerTitle");
const drawerEyebrow = document.getElementById("drawerEyebrow");
const drawerBody = document.getElementById("drawerBody");
const sidebar = document.getElementById("sidebar");
const toast = document.getElementById("toast");
let currentView = "overview";

const viewTitles = {
  overview: "Tổng quan điều hành",
  progress: "Tiến độ thi công",
  actions: "Cam kết và đầu việc",
  monitoring: "Quan trắc công trình",
  lookahead: "Kế hoạch 3 tuần tiếp theo"
};

function statusPill(status) {
  const map = {
    overdue: ["Quá hạn", "pill-red"],
    due: ["Đến hạn", "pill-amber"],
    upcoming: ["Sắp đến hạn", "pill-blue"],
    completed: ["Hoàn thành", "pill-green"],
    highest: ["Cao nhất", "pill-red"],
    review: ["Cần theo dõi", "pill-amber"],
    normal: ["Ghi nhận", "pill-green"]
  };
  const [label, klass] = map[status] || [status, "pill-gray"];
  return `<span class="status-pill ${klass}">${label}</span>`;
}

function kpiCard(label, value, unit, status, foot, trendClass = "") {
  return `
    <article class="kpi">
      <div class="kpi-head"><span>${label}</span>${status || ""}</div>
      <div class="kpi-value">${value}<span class="kpi-unit">${unit || ""}</span></div>
      <div class="kpi-foot"><span>${foot}</span><span class="${trendClass}"></span></div>
    </article>`;
}

function pageIntro(title, description, controls = "") {
  return `
    <div class="page-intro">
      <div><h2>${title}</h2><p>${description}</p></div>
      ${controls ? `<div class="filter-row">${controls}</div>` : ""}
    </div>`;
}

function showToast(message, timeout = 1800) {
  toast.textContent = message;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), timeout);
}

function refreshDashboardData() {
  const button = document.getElementById("refreshButton");
  const appsScriptApi = window.google?.script?.run;
  if (!appsScriptApi) {
    showToast("Đã cập nhật dữ liệu hiển thị");
    drawAllCharts();
    return;
  }

  button.disabled = true;
  showToast("Đang lấy dữ liệu mới từ Google Drive...", 2200);
  appsScriptApi
    .withSuccessHandler(freshData => {
      data = freshData;
      window.CN8_DATA = freshData;
      updateSyncStatus();
      renderView(currentView);
      button.disabled = false;
      showToast("Đã cập nhật dữ liệu mới từ Google Drive");
    })
    .withFailureHandler(error => {
      button.disabled = false;
      showToast(`Không cập nhật được: ${error?.message || error}`, 2600);
    })
    .getDashboardData();
}

function drawLineChart(canvas, series, compact = false) {
  if (!canvas) return;
  const rect = canvas.getBoundingClientRect();
  const ratio = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, rect.width * ratio);
  canvas.height = Math.max(1, rect.height * ratio);
  const ctx = canvas.getContext("2d");
  ctx.scale(ratio, ratio);
  const width = rect.width;
  const height = rect.height;
  const pad = compact ? { l: 3, r: 3, t: 5, b: 3 } : { l: 38, r: 15, t: 16, b: 28 };
  const plotW = width - pad.l - pad.r;
  const plotH = height - pad.t - pad.b;
  const values = series.flatMap(s => s.values);
  const max = Math.max(...values) * 1.12 || 1;
  const min = compact ? Math.min(...values) * .9 : 0;

  if (!compact) {
    ctx.strokeStyle = "#e4e8eb";
    ctx.fillStyle = "#71808d";
    ctx.font = "10px Arial";
    ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const y = pad.t + (plotH / 4) * i;
      ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(width - pad.r, y); ctx.stroke();
      ctx.fillText((max - (max / 4) * i).toFixed(1) + "%", 2, y + 3);
    }
    const labels = data.progressTrend.map(d => d.label);
    labels.forEach((label, i) => {
      const x = pad.l + (plotW / (labels.length - 1)) * i;
      ctx.fillText(label, x - 10, height - 6);
    });
  }

  series.forEach(s => {
    ctx.strokeStyle = s.color;
    ctx.fillStyle = s.color;
    ctx.lineWidth = compact ? 2 : 2.5;
    ctx.beginPath();
    s.values.forEach((v, i) => {
      const x = pad.l + (plotW / Math.max(1, s.values.length - 1)) * i;
      const y = pad.t + plotH - ((v - min) / Math.max(.001, max - min)) * plotH;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    if (!compact) {
      s.values.forEach((v, i) => {
        const x = pad.l + (plotW / Math.max(1, s.values.length - 1)) * i;
        const y = pad.t + plotH - ((v - min) / Math.max(.001, max - min)) * plotH;
        ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
      });
    }
  });
}

function drawAllCharts() {
  const progressCanvas = document.getElementById("progressChart");
  if (progressCanvas) {
    drawLineChart(progressCanvas, [
      { color: "#236aa2", values: data.progressTrend.map(d => d.plan) },
      { color: "#16736f", values: data.progressTrend.map(d => d.actual) }
    ]);
  }
  document.querySelectorAll(".sparkline").forEach(canvas => {
    const values = canvas.dataset.values.split(",").map(Number);
    drawLineChart(canvas, [{ color: "#236aa2", values }], true);
  });
}

function openDrawer(eyebrow, title, body) {
  drawerEyebrow.textContent = eyebrow;
  drawerTitle.textContent = title;
  drawerBody.innerHTML = body;
  drawer.setAttribute("aria-hidden", "false");
  document.body.classList.add("drawer-open");
}

function closeDrawer() {
  drawer.setAttribute("aria-hidden", "true");
  document.body.classList.remove("drawer-open");
}

function openAction(id) {
  const a = data.actions.find(item => item.id === id);
  if (!a) return;
  openDrawer("CAM KẾT HỌP", a.title, `
    <div class="detail-section"><h3>Trạng thái</h3>${statusPill(a.status)}</div>
    <div class="detail-section"><h3>Thông tin quản lý</h3><div class="detail-grid">
      <span>Mã đầu việc</span><strong>${a.id}</strong>
      <span>Chuyên môn</span><strong>${a.discipline}</strong>
      <span>Đơn vị</span><strong>${a.owner}</strong>
      <span>Hạn hoàn thành</span><strong>${a.due}</strong>
      <span>Nguồn</span><strong>${a.source}</strong>
    </div></div>
    <div class="detail-section"><h3>Đánh giá</h3><p>${a.note}</p></div>
    <div class="detail-section"><h3>Bằng chứng hoàn thành</h3><p class="cell-sub">Chưa có tệp hoặc xác nhận được liên kết trong phiên bản MVP.</p></div>
  `);
}

function openDocument(index) {
  const d = data.documents[index];
  if (!d) return;
  openDrawer("TÀI LIỆU NGUỒN", d.name, `
    <div class="detail-section"><h3>Thông tin</h3><div class="detail-grid">
      <span>Loại hồ sơ</span><strong>${d.type}</strong>
      <span>Đơn vị</span><strong>${d.owner}</strong>
      <span>Ngày cập nhật</span><strong>${d.date}</strong>
      <span>Trạng thái</span><strong>${d.status}</strong>
    </div></div>
    <div class="detail-section"><h3>Đường dẫn đồng bộ</h3><div class="path-box" id="sourcePath">${d.path}</div></div>
    <button class="copy-button" data-copy-path="${encodeURIComponent(d.path)}">Sao chép đường dẫn</button>
  `);
}

function openMonitoring(index) {
  const m = data.monitoring[index];
  if (!m) return;
  openDrawer("QUAN TRẮC INCLINOMETER", `${m.point} · ${m.value} mm`, `
    <div class="detail-section"><h3>Dữ liệu chu kỳ</h3><div class="detail-grid">
      <span>Mốc đo</span><strong>${m.point}</strong>
      <span>Chu kỳ</span><strong>${m.cycle}</strong>
      <span>Ngày đo</span><strong>${m.date}</strong>
      <span>Giá trị lớn nhất</span><strong>${m.value} mm</strong>
      <span>Phân loại</span><strong>${statusPill(m.status)}</strong>
    </div></div>
    <div class="detail-section"><h3>Diễn giải</h3><p>Giá trị được trích xuất từ cột chuyển vị tuyệt đối trong báo cáo nhanh. Cần kiểm tra lại độ sâu, hướng đo và ngưỡng cảnh báo được phê duyệt.</p></div>
    <div class="monitor-note">Không sử dụng phân loại trên website thay cho kết luận của đơn vị quan trắc và TVGS.</div>
  `);
}

function filterActions() {
  const search = (document.getElementById("actionSearch")?.value || "").toLowerCase();
  const status = document.getElementById("actionStatus")?.value || "all";
  const filtered = data.actions.filter(a => {
    const matchesText = `${a.title} ${a.owner} ${a.discipline}`.toLowerCase().includes(search);
    return matchesText && (status === "all" || a.status === status);
  });
  document.getElementById("actionTable").innerHTML = actionTable(filtered);
  bindRowEvents();
}

function filterDocuments() {
  const search = (document.getElementById("documentSearch")?.value || "").toLowerCase();
  const type = document.getElementById("documentType")?.value || "all";
  const indexed = data.documents.map((d, index) => ({ d, index })).filter(({d}) => {
    const matchesText = `${d.name} ${d.type} ${d.owner}`.toLowerCase().includes(search);
    return matchesText && (type === "all" || d.type === type);
  });
  document.getElementById("documentList").innerHTML = indexed.map(({d,index}) => `
    <div class="doc-item click-row" data-document-index="${index}">
      <span class="file-type">${d.type}</span>
      <div><div class="doc-name">${d.name}</div><div class="doc-meta">${d.owner}</div></div>
      <span class="doc-meta">${d.date}</span>
      <span class="status-pill pill-gray">${d.status}</span>
    </div>`).join("");
  bindRowEvents();
}

function bindRowEvents() {
  document.querySelectorAll("[data-action-id]").forEach(row => row.addEventListener("click", () => openAction(row.dataset.actionId)));
  document.querySelectorAll("[data-document-index]").forEach(row => row.addEventListener("click", () => openDocument(Number(row.dataset.documentIndex))));
  document.querySelectorAll("[data-monitor-index]").forEach(card => card.addEventListener("click", () => openMonitoring(Number(card.dataset.monitorIndex))));
}

function bindDynamicEvents() {
  bindRowEvents();
  document.querySelectorAll("[data-go-view]").forEach(button => button.addEventListener("click", () => renderView(button.dataset.goView)));
  document.getElementById("actionSearch")?.addEventListener("input", filterActions);
  document.getElementById("actionStatus")?.addEventListener("change", filterActions);
  document.querySelectorAll("[data-week-id]").forEach(card => card.addEventListener("click", () => {
    const week = data.lookahead.weeks.find(item => item.id === card.dataset.weekId);
    if (!week) return;
    document.querySelectorAll("[data-week-id]").forEach(item => item.classList.toggle("active", item === card));
    document.getElementById("lookaheadTasks").innerHTML = lookaheadTaskTable(week);
    document.getElementById("gateList").innerHTML = week.gates.map(g => `<div class="gate-item"><span>✓</span>${g}</div>`).join("");
  }));
  document.getElementById("scheduleSourceButton")?.addEventListener("click", () => {
    const source = data.lookahead.source;
    openDrawer("TIẾN ĐỘ ĐƯỢC DUYỆT", source.name, `
      <div class="detail-section"><h3>Thông tin phê duyệt</h3><div class="detail-grid">
        <span>Trạng thái</span><strong>${source.approval}</strong>
        <span>Ngày tiến độ</span><strong>${source.scheduleDate}</strong>
        <span>Phạm vi</span><strong>Overall Construction Schedule Rev01</strong>
      </div></div>
      <div class="detail-section"><h3>Đường dẫn nguồn</h3><div class="path-box">${source.path}</div></div>
      <button class="copy-button" data-copy-path="${encodeURIComponent(source.path)}">Sao chép đường dẫn</button>
    `);
  });
}

document.querySelectorAll(".nav-item").forEach(item => item.addEventListener("click", () => renderView(item.dataset.view)));
document.getElementById("menuButton").addEventListener("click", () => sidebar.classList.toggle("open"));
document.getElementById("closeDrawer").addEventListener("click", closeDrawer);
drawerBackdrop.addEventListener("click", closeDrawer);
document.getElementById("refreshButton").addEventListener("click", () => {
  refreshDashboardData();
});
document.addEventListener("click", event => {
  const button = event.target.closest("[data-copy-path]");
  if (!button) return;
  const path = decodeURIComponent(button.dataset.copyPath);
  navigator.clipboard?.writeText(path);
  toast.textContent = "Đã sao chép đường dẫn nguồn";
  toast.classList.add("show");
  setTimeout(() => { toast.classList.remove("show"); toast.textContent = "Đã cập nhật dữ liệu hiển thị"; }, 1800);
});
window.addEventListener("resize", () => requestAnimationFrame(drawAllCharts));
window.addEventListener("keydown", event => { if (event.key === "Escape") closeDrawer(); });

renderView("overview");
updateSyncStatus();

  </script>
</body>
</html>
